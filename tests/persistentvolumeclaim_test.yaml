suite: PersistentVolumeClaim
release:
  name: recyclarr
templates:
  - templates/persistentvolumeclaim.yaml
tests:
  - it: creates a 1Gi claim for /config in the default storage class
    asserts:
      - equal:
          path: metadata.name
          value: recyclarr-config
      - equal:
          path: spec
          value:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi

  - it: uses the storage class and size when they are set
    set:
      persistence.storageClassName: fast
      persistence.size: 2Gi
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi

  - it: creates no claim for an existing one
    set:
      persistence.existingClaim: my-config
    asserts:
      - hasDocuments:
          count: 0

  - it: fails with neither an existing claim nor a size
    set:
      persistence.size: ""
    asserts:
      - failedTemplate:
          errorMessage: persistence needs an existingClaim or a size
